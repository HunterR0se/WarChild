[package]
name = "warchild"
version = "0.1.0"
edition = "2021"
authors = ["HunterR0se"]
description = "A gravity-based, 2D Side Scroller with platforming and combat elements, written in Rust"

[dependencies]
macroquad = "0.4" # Current stable version
rand = "0.8.5"    # For random number generation
futures = "0.3"   # For async/await utilities in non-wasm

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

# Enable optimizations for dependencies (not our code):
[profile.dev.package."*"]
opt-level = 3

# Enable high optimizations for our code in debug mode:
[profile.dev]
opt-level = 1

# Enable max optimizations for release builds
[profile.release]
opt-level = 3
lto = "thin"
